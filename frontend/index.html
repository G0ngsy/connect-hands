<!doctype html>
<html lang="ko"> <!-- 언어를 ko(한국어)로 변경 -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 페이지 제목: 브라우저 탭과 앱 설치 시 이름으로 사용됩니다 -->
    <title>Connect·Hands | 실시간 수어 AI 통역</title>

    <!-- PWA 및 아이콘 설정 (RealFaviconGenerator에서 받은 코드) -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ConnectHands" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- 모바일 환경 최적화: 상단바 색상을 프로젝트 핑크색으로 맞춤 -->
    <meta name="theme-color" content="#FFF5F8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- 기존 vite.svg 아이콘은 삭제했습니다 (충돌 방지) -->
  </head>
  <body>
     <div id="global-loader" style="
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: #FFF5F8;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s ease;
  ">
    <!-- 로고 영역 -->
    <div style="font-size: 50px; margin-bottom: 20px; animation: bounce 2s infinite;">
      👉<span style="color: #FF66B2;">·</span>👈
    </div>
    <!-- 로딩 텍스트 -->
    <div style="
      color: #FF66B2;
      font-weight: 900;
      letter-spacing: 0.2em;
      font-family: sans-serif;
      font-size: 14px;
    ">CONNECT·HANDS</div>
    
    <style>
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }
    </style>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- 리액트가 로드되면 로더를 지우는 스크립트 -->
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('global-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);
      }
    });
  </script>
  </body>
</html>
